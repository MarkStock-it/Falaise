# Render blueprint for FALAISE: storefront + admin CMS in one web service.
#
# The SQLite database, the session secret and every uploaded image live under
# /data, so the service needs one persistent disk and must stay on a single
# instance. Never scale this service horizontally; a second instance would run
# against a second, empty disk.
#
# Deploying this file creates the service. ADMIN_PASSWORD is asked for once in
# the dashboard; SESSION_SECRET is generated by Render and never leaves it.
services:
  - type: web
    name: falaise
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: falaise-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      # First boot only: ignored once the admin row exists.
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
