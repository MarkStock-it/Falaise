# Keeps a Render free-tier service from spinning down after 15 idle minutes by
# requesting /api/health every five minutes.
#
# Set the site once: Settings -> Secrets and variables -> Actions -> Variables
# -> New repository variable named APP_URL, for example
# https://falaise.onrender.com (no trailing slash, no path).
#
# Things worth knowing before relying on this:
# - GitHub's scheduler has a five-minute minimum and starts runs late under
#   load, so this is a keep-alive, not uptime monitoring. Use UptimeRobot or
#   cron-job.org if you want alerts and a history graph.
# - Scheduled workflows run from the default branch only. On a feature branch
#   this file does nothing until it is merged.
# - GitHub disables a schedule after 60 days without repository activity.
# - Each run bills at least one minute. On a private repository that is around
#   8,600 minutes a month against the 2,000 included in the Free plan, so a
#   hosted monitor is the cheaper choice there. Public repositories are free.
name: Keep alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check APP_URL is set
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the APP_URL repository variable to the site's base URL, for example https://falaise.onrender.com"
            exit 1
          fi

      - name: Ping /api/health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # A cold start can take most of a minute, so allow 90 seconds and let
          # curl retry connection failures and 5xx responses.
          status=$(curl --silent --show-error --location \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 90 \
            --output /tmp/health.json --write-out '%{http_code}' \
            "$APP_URL/api/health")
          echo "HTTP $status"
          cat /tmp/health.json 2>/dev/null || true
          echo
          if [ "$status" != "200" ]; then
            echo "::error::Health check returned HTTP $status."
            exit 1
          fi
          if ! grep -q '"ok":true' /tmp/health.json; then
            echo "::error::The service answered, but /api/health did not report ok."
            exit 1
          fi
          echo "Service is awake."
